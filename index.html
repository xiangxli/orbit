<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Earth Orbit Around the Sun</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: absolute; top: 16px; left: 16px;
    background: rgba(10, 14, 24, 0.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 14px 16px;
    color: #e8eefc;
    min-width: 240px;
    user-select: none;
  }
  #hud h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; color: #ffd27a; }
  #hudHeader { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  #hudToggle {
    background: rgba(255, 210, 122, 0.1); color: #ffd27a;
    border: 1px solid rgba(255, 210, 122, 0.4); border-radius: 6px;
    width: 28px; height: 28px; padding: 0; flex: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #hudToggle:hover { background: rgba(255, 210, 122, 0.25); }
  #hudToggle .chev { transition: transform 0.18s ease; }
  #hud.collapsed #hudToggle .chev { transform: rotate(180deg); }
  #hud.collapsed { min-width: 0; padding-bottom: 10px; }
  #hud.collapsed #hudHeader { margin-bottom: 0; }
  #hud.collapsed #hudBody { display: none; }
  #hud label { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 7px 0; color: #b9c6e0; cursor: pointer; }
  #hud input[type="range"] { flex: 1; accent-color: #ffd27a; height: 4px; }
  #hud input[type="checkbox"] { accent-color: #ffd27a; }
  #starList {
    flex: 1; min-width: 0; font-size: 12px; padding: 3px 6px;
    background: rgba(20, 26, 40, 0.9); color: #e8eefc;
    border: 1px solid rgba(255, 210, 122, 0.4); border-radius: 6px;
  }
  #observer, #reset {
    margin-top: 8px; width: 100%; padding: 6px 0; font-size: 12px;
    background: rgba(255, 210, 122, 0.12); color: #ffd27a;
    border: 1px solid rgba(255, 210, 122, 0.4); border-radius: 6px;
    cursor: pointer; transition: background 0.15s;
  }
  #observer:hover, #reset:hover { background: rgba(255, 210, 122, 0.25); }
  #observer.active { background: rgba(255, 210, 122, 0.4); border-color: #ffd27a; }
  #hud .stat { font-size: 11px; color: #7f8db0; margin-top: 8px; }
  #hud .stat span { color: #ffd27a; }
  #hud { touch-action: manipulation; }
  #todayRow { cursor: pointer; }
  #todayRow:hover { color: #ffffff; text-shadow: 0 0 8px rgba(255, 210, 122, 0.9), 0 0 16px rgba(255, 210, 122, 0.5); }
  #todayRow:hover span { color: #ffd27a; }
  @media (max-width: 640px) {
    #hud { top: 8px; left: 8px; right: auto; max-width: calc(100vw - 16px); }
    #hudToggle { width: 36px; height: 36px; }
    #hud h1 { font-size: 13px; }
  }
</style>
</head>
<body>

<div id="hud">
  <div id="hudHeader">
    <h1 id="hudTitle">EARTH &bull; SUN SYSTEM</h1>
    <button id="hudToggle" aria-label="Toggle panel" title="Show/hide controls">
      <svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="hudBody">
    <label><span id="lblDayLen">Day length (s)</span>
      <input type="range" id="dayLen" min="0.5" max="60" value="3.4" step="0.1" />
    </label>
    <label><span id="lblSpeed">Orbit speed (real = 100)</span>
      <input type="range" id="speed" min="0" max="300" value="100" step="1" />
    </label>
    <label><span id="lblRotSpeed">Rotation speed (real = 100)</span>
      <input type="range" id="rotSpeed" min="0" max="300" value="100" step="1" />
    </label>
    <label><span id="lblMoonSpeed">Moon speed (real = 100)</span>
      <input type="range" id="moonSpeed" min="0" max="300" value="100" step="1" />
    </label>
    <button id="resetRatio"><span id="lblResetRatio">Reset real ratios</span></button>
    <label><span id="lblLat">Observer latitude (observer view)</span>
      <input type="range" id="lat" min="0" max="90" value="45" step="1" />
    </label>
    <label><input type="checkbox" id="annual" /> <span id="lblAnnual">Annual view (fixed local time)</span></label>
    <label><input type="checkbox" id="pause" /> <span id="lblPause">Pause</span></label>
    <label><input type="checkbox" id="clouds" checked /> <span id="lblClouds">Clouds layer</span></label>
    <label><input type="checkbox" id="moon" checked /> <span id="lblMoon">Moon</span></label>
    <label><input type="checkbox" id="orbitPath" /> <span id="lblOrbitPath">Orbit path</span></label>
    <label><input type="checkbox" id="axis" /> <span id="lblAxis">Show Earth's tilt axis</span></label>
    <label><input type="checkbox" id="polaris" checked /> <span id="lblPolaris">Polaris</span></label>
    <label><input type="checkbox" id="polarisLine" /> <span id="lblPolarisLine">Polaris hint line</span></label>
    <label><input type="checkbox" id="dipper" checked /> <span id="lblDipper">Big Dipper</span></label>
    <label><input type="checkbox" id="dipperLine" /> <span id="lblDipperLine">Dipper pointer line</span></label>
    <label><input type="checkbox" id="rays" /> <span id="lblRays">Sun light rays</span></label>
    <label><input type="checkbox" id="equator" checked /> <span id="lblEquator">Equator</span></label>
    <label><input type="checkbox" id="starfield" /> <span id="lblStarfield">Background stars</span></label>
    <label><span id="lblGoTo">Go to:</span>
      <select id="starList"></select>
    </label>
    <button id="observer"><span id="lblObserver">Observer view</span></button>
    <button id="reset"><span id="lblReset">Reset camera</span></button>
    <div class="stat"><span id="lblAngle">Orbital angle:</span> <span id="angle">0.0&deg;</span></div>
    <div class="stat" id="todayRow" title="Click to go to today"><span id="lblToday">Today:</span> <span id="todayDate">-</span></div>
    <div class="stat"><span id="lblDay">Day of year:</span> <span id="day">1</span> / 365 &middot; <span id="season">-</span></div>
    <div class="stat"><span id="lblHour">Hour of day:</span> <span id="hour">0.0</span> h</div>
    <div class="stat"><span id="lblOrbit">Orbit:</span> <span id="orbitRate"></span> &nbsp; <span id="lblRotation">Rotation:</span> <span id="spinRate"></span></div>
    <div class="stat"><span id="lblMoonRate">Moon:</span> <span id="moonRate"></span></div>
    <div class="stat"><span id="lblFps">Render rate:</span> <span id="fps">-</span> fps</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- True scale (Earth radius = 1 unit) ----
const EARTH_RADIUS = 1.0;            // 6,371 km
const SUN_RADIUS = 109.2;            // 695,700 km  -> 109.2x Earth
const ORBIT_RADIUS = 23481.2;        // 1 AU = 149,597,870 km = 23,481x Earth radius
const SKY_RADIUS = 850000;           // decorative sky objects live beyond the orbit
                                     // (10x further than needed for the markers; keeps
                                     // stellar parallax below ~1.5deg so Polaris sits
                                     // at its true altitude from any observer)

// ---- Today mapping ----
// The internal calendar is anchored so orbit angle 0 = Dec 21 (Northern
// winter solstice). The "Today" button jumps the demo state to the real
// current date via this mapping.
const DAYS_YEAR = 365.25;
function dayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 1);
  return Math.floor((date - start) / 86400000) + 1;
}
const SOLSTICE_DAY = dayOfYear(new Date(new Date().getFullYear(), 11, 21));
function demoDayFromToday() {
  const today = dayOfYear(new Date());
  let d = (today - SOLSTICE_DAY + 1) % DAYS_YEAR;
  if (d < 1) d += DAYS_YEAR;
  return d;
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 2000000);
// Default view: the Earth up close with the Sun's disc just beside its limb
// (close distance + small lateral offset), starting at day 1 (Dec 21).
camera.position.set(ORBIT_RADIUS + 11.5, 0, 1.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power', logarithmicDepthBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 120000;
// Allow the camera to loop fully around the Earth: the polar angle wraps
// through 360° (over the top, under the bottom) in one continuous drag.
controls.minPolarAngle = -2 * Math.PI;
controls.maxPolarAngle = 2 * Math.PI;
controls.target.set(ORBIT_RADIUS, 0, 0);

// ---- Sun ----
const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sunGeo = new THREE.SphereGeometry(SUN_RADIUS, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc55 });
const sun = new THREE.Mesh(sunGeo, sunMat);
sunGroup.add(sun);

// Glow sprite texture (generated radial gradient)
function makeGlowTexture(inner, mid, edge) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, inner);
  g.addColorStop(0.25, mid);
  g.addColorStop(0.6, 'rgba(255, 120, 40, 0.15)');
  g.addColorStop(1, edge);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(255, 214, 130, 1)', 'rgba(255, 180, 80, 0.55)', 'rgba(255, 80, 20, 0)'),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
}));
glow.scale.set(SUN_RADIUS * 7.3, SUN_RADIUS * 7.3, 1);
sunGroup.add(glow);

// Faint corona ring for flair
const corona = new THREE.Mesh(
  new THREE.RingGeometry(SUN_RADIUS * 1.08, SUN_RADIUS * 1.20, 64),
  new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
);
corona.rotation.x = Math.PI / 2;
sunGroup.add(corona);

// ---- Lighting ----
const sunLight = new THREE.PointLight(0xffffff, 1.6, 0, 0);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223344, 0.5));

// ---- Stars (realistic magnitude distribution: a few bright, many faint) ----
const STAR_BINS = [
  { count: 40,   size: 3.2, color: 0xfff0d6 },   // mag < 1
  { count: 260,  size: 2.4, color: 0xeef4ff },   // mag 1-2.5
  { count: 1300, size: 1.7, color: 0xd5dff5 },   // mag 2.5-4.5
  { count: 4400, size: 1.1, color: 0xaebad4 },   // mag > 4.5
];
const starfieldGroup = new THREE.Group();
starfieldGroup.visible = false;   // decorative backdrop, off by default
scene.add(starfieldGroup);
for (const bin of STAR_BINS) {
  const pos = new Float32Array(bin.count * 3);
  for (let i = 0; i < bin.count * 3; i += 3) {
    const r = SKY_RADIUS * 0.7 + Math.random() * SKY_RADIUS * 0.7;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i + 2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starfieldGroup.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: bin.color,
    size: bin.size,
    sizeAttenuation: false,
  })));
}

// ---- Earth ----
const EARTH_TILT = 23.44 * Math.PI / 180;

// Earth's spin axis is fixed in space (like the real one), pointing toward Polaris:
// tilted 23.44° from the orbit normal (+Y), leaning toward +X.
const POLARIS_DIR = new THREE.Vector3(Math.sin(EARTH_TILT), Math.cos(EARTH_TILT), 0);
const POLARIS_DIST = SKY_RADIUS;         // far away, beyond the orbit
const POLARIS_POS = POLARIS_DIR.clone().multiplyScalar(POLARIS_DIST);

const earthPivot = new THREE.Group();     // positioned along the orbit each frame
earthPivot.rotation.z = -EARTH_TILT;      // fixed axial tilt -> spin axis = POLARIS_DIR
earthPivot.position.set(ORBIT_RADIUS, 0, 0);   // start at day 1 (Dec 21)
scene.add(earthPivot);

const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

const earthMat = new THREE.MeshPhongMaterial({
  map: loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
  specularMap: loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'),
  specular: new THREE.Color(0x333333),
  shininess: 8,
  emissive: new THREE.Color(0x0a1420),
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS, 64, 64), earthMat);
earthPivot.add(earth);

// Observer anchor: rides the spinning Earth at any latitude (0 = equator,
// 90 = north pole). Position set per-frame in updateObserverView().
const observer = new THREE.Group();
earth.add(observer);

// ---- Moon (true scale) ----
// Radius 1,737 km = 0.273 Earth radii; orbit 384,400 km = 60.3 Earth radii;
// orbital plane tilted 5.1 deg from the ecliptic; 13.37 orbits per year;
// tidally locked (always shows the same face to Earth).
const MOON_RADIUS = 0.2727;
const MOON_ORBIT = 60.3;
const MOON_TILT = 5.1 * Math.PI / 180;
const MOON_ORBITS_PER_YEAR = 365.25 / 27.32;

const moonGroup = new THREE.Group();
moonGroup.rotation.x = MOON_TILT;
scene.add(moonGroup);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(MOON_RADIUS, 48, 48),
  new THREE.MeshPhongMaterial({
    map: loader.load('https://threejs.org/examples/textures/planets/moon_1024.jpg'),
    emissive: new THREE.Color(0x0a0a0a),
    shininess: 2,
  })
);
moon.position.x = MOON_ORBIT;
moon.rotation.y = Math.PI;   // same face always points at Earth (tidal lock)
moonGroup.add(moon);

// Clouds layer (rotates slightly faster)
const cloudMat = new THREE.MeshPhongMaterial({
  map: loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
  transparent: true,
  opacity: 0.6,
  depthWrite: false,
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS * 1.03, 64, 64), cloudMat);
earthPivot.add(clouds);

// Equator (great circle perpendicular to the spin axis, drawn over the surface)
const equator = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(
    Array.from({ length: 96 }, (_, i) => {
      const a = (i / 96) * Math.PI * 2;
      return new THREE.Vector3(Math.cos(a) * (EARTH_RADIUS + 0.01), 0, Math.sin(a) * (EARTH_RADIUS + 0.01));
    })
  ),
  new THREE.LineBasicMaterial({ color: 0x59d9a8, transparent: true, opacity: 0.85, depthWrite: false })
);
equator.renderOrder = 4;
earth.add(equator);

// Tilt axis indicator (along the spin axis, through the planet's center)
const axisMat = new THREE.MeshBasicMaterial({ color: 0x7fd7ff, transparent: true, opacity: 0.7 });
const axisLine = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, EARTH_RADIUS * 5, 6), axisMat);
const axisTip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), axisMat);
axisTip.position.y = EARTH_RADIUS * 2.5;
const axisTip2 = axisTip.clone();
axisTip2.position.y = -EARTH_RADIUS * 2.5;
const axisGroup = new THREE.Group();
axisGroup.add(axisLine, axisTip, axisTip2);
axisGroup.visible = false;
earthPivot.add(axisGroup);

// ---- Polaris ----
const polarisGroup = new THREE.Group();
scene.add(polarisGroup);

// Star glow texture: a bright compact core + soft halo, so stars read as
// crisp points with a glow instead of a barely-visible gradient wash.
function makeStarGlow(r, g, b) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.05, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.18, `rgba(${r},${g},${b},0.55)`);
  grad.addColorStop(0.45, `rgba(${r},${g},${b},0.18)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}

// Polaris: yellow supergiant, ~37.5 solar radii, mag 1.98
const polarisSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeStarGlow(255, 232, 200),
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
  opacity: Math.max(0.3, 0.8 * Math.pow(2.512, 1.77 - 1.98)),   // flux by apparent magnitude
}));
polarisSprite.position.copy(POLARIS_POS);
polarisSprite.scale.setScalar(37.5 * 700);
polarisGroup.add(polarisSprite);

// "Polaris" label
function makeLabelTexture(text, sub = null) {
  const two = sub !== null;
  const c = document.createElement('canvas');
  c.width = 512; c.height = two ? 192 : 128;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(150, 190, 255, 0.9)';
  ctx.shadowBlur = 18;
  ctx.font = 'bold 72px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = '#d6e6ff';
  ctx.fillText(text, 256, two ? 80 : 64);
  if (two) {
    let subSize = 40;
    ctx.font = 'bold ' + subSize + 'px -apple-system, "Segoe UI", Roboto, sans-serif';
    if (ctx.measureText(sub).width > 470) {
      subSize = 32;
      ctx.font = 'bold ' + subSize + 'px -apple-system, "Segoe UI", Roboto, sans-serif';
    }
    ctx.fillStyle = '#9fb4d8';
    ctx.fillText(sub, 256, 148);
  }
  return new THREE.CanvasTexture(c);
}
const polarisLabel = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeLabelTexture('POLARIS'),
  transparent: true,
  depthWrite: false,
}));
polarisLabel.position.copy(POLARIS_POS).addScaledVector(POLARIS_DIR, -26250);
polarisLabel.scale.set(54090, 13520, 1);
polarisGroup.add(polarisLabel);

// Hint line: from Earth's north pole toward Polaris (dashed, updated each frame)
const hintGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const hintLine = new THREE.Line(hintGeo, new THREE.LineDashedMaterial({
  color: 0x9fd8ff,
  dashSize: 60,
  gapSize: 40,
  transparent: true,
  opacity: 0.5,
}));
hintLine.computeLineDistances();   // precompute dashed-line distances (done once)
scene.add(hintLine);

// ---- Big Dipper (Ursa Major) ----
// Real sky geometry: each star's angular distance (theta) and position angle
// (PA) from the celestial pole (Polaris). The pointer stars Dubhe & Merak
// share the same PA, so the Merak -> Dubhe line extended lands on Polaris.
const BD_RADIUS = SKY_RADIUS;
// name, theta(deg), PA(deg), radius (solar radii), apparent magnitude, spectral tint
// name, theta(deg), PA(deg), radius (solar radii), apparent magnitude, spectral tint (r,g,b)
const BD_STARS = [
  ['Dubhe',  28.6, 51.4, 15.0, 1.79, 255, 210, 161],
  ['Merak',  34.0, 51.6,  3.0, 2.37, 232, 239, 255],
  ['Phecda', 36.9, 38.9,  3.1, 2.44, 232, 239, 255],
  ['Megrez', 33.6, 33.4,  1.4, 3.31, 232, 239, 255],
  ['Alioth', 34.7, 23.8,  4.1, 1.77, 232, 239, 255],
  ['Mizar',  35.7, 16.7,  3.7, 2.27, 232, 239, 255],
  ['Alkaid', 41.4, 10.8,  6.1, 1.86, 202, 216, 255],
];
const BD_STAR_SIZE = 700;         // world units per solar radius
const BD_STAR_MIN = 3000;         // minimum size so all 7 stars read clearly (~0.2 deg)
const BD_BRIGHTEST_MAG = 1.77;    // Alioth — flux reference
const BD_EDGES = [[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]];

// Orthonormal sky basis around the celestial pole
const skyY = POLARIS_DIR.clone();
const skyZ = new THREE.Vector3().crossVectors(POLARIS_DIR, new THREE.Vector3(0, 1, 0)).normalize();
const skyX = new THREE.Vector3().crossVectors(skyY, skyZ);

function skyDir(thetaDeg, paDeg) {
  const th = THREE.MathUtils.degToRad(thetaDeg);
  const pa = THREE.MathUtils.degToRad(paDeg);
  return new THREE.Vector3()
    .addScaledVector(skyY, Math.cos(th))
    .addScaledVector(skyX, Math.sin(th) * Math.cos(pa))
    .addScaledVector(skyZ, Math.sin(th) * Math.sin(pa));
}

const bdGroup = new THREE.Group();
scene.add(bdGroup);

const bdPos = BD_STARS.map((s) => skyDir(s[1], s[2]).multiplyScalar(BD_RADIUS));

// Stick-figure connecting lines (bowl + handle)
const bdPts = [];
for (const [i, j] of BD_EDGES) { bdPts.push(bdPos[i], bdPos[j]); }
const bdLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(bdPts),
  new THREE.LineBasicMaterial({ color: 0x9db4d8, transparent: true, opacity: 0.5 })
);
bdGroup.add(bdLine);

// Star markers: size proportional to each star's real radius (solar units)
// with a minimum apparent size, brightness from its apparent magnitude,
// tinted by spectral class.
for (let i = 0; i < BD_STARS.length; i++) {
  const [, , , radiusSun, mag, r, g, b] = BD_STARS[i];
  const star = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeStarGlow(r, g, b),
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,

// ---- Sun light rays ----
// Sunlight reaching Earth is essentially parallel (the Sun subtends only
// 0.53°), so this is a cylinder of parallel rays around the Sun-Earth axis.
// Rays emerge from the Sun's near surface; the ones that hit stop exactly at
// the day-side surface, the tangent rays graze the terminator, and the rest
// sweep past the night side. Being a full cylinder, rays are visible from
// any camera angle.
const RAY_OFFSETS = [0, 0.5, 1.0, 1.5, 2.5, 4, 6, 9, 13, 18, 24.5, 32.5, 42, 53.5, 67, 82.5, 99.5];
const RAY_AZIMUTHS = [0, 60, 120, 180, 240, 300].map((d) => (d * Math.PI) / 180);
const RAY_HIT = RAY_OFFSETS.filter((o) => o <= EARTH_RADIUS);   // touches the surface
const RAY_MISS = RAY_OFFSETS.filter((o) => o > EARTH_RADIUS);   // passes by

function makeRays(offsets, color, opacity) {
  const n = offsets.reduce((acc, o) => acc + (o === 0 ? 1 : RAY_AZIMUTHS.length), 0) * 2;
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const lines = new THREE.LineSegments(geom, new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity,
    depthWrite: false,
  }));
  lines.renderOrder = 5;
  scene.add(lines);
  return lines;
}
const hitRays = makeRays(RAY_HIT, 0xffdf9e, 0.6);
const missRays = makeRays(RAY_MISS, 0xffc96b, 0.3);
const _rayDir = new THREE.Vector3();

function writeRay(attr, i, o, az, isHit) {
  // lateral offset o at azimuth az around the Sun-Earth axis
  // (e1 = vertical, e2 = cross(d, e1); d is horizontal so e1 = (0,1,0))
  const ca = Math.cos(az), sa = Math.sin(az);
  const lx = o * sa * (-_rayDir.z);
  const ly = o * ca;
  const lz = o * sa * _rayDir.x;
  // Start on the Sun's near surface (nudged out so it doesn't z-fight)
  const sunReach = Math.sqrt(SUN_RADIUS * SUN_RADIUS - o * o) + 0.4;
  attr.setXYZ(i++, _rayDir.x * sunReach + lx, ly, _rayDir.z * sunReach + lz);
  // End at the day-side surface, or sweep past the night side
  if (isHit) {
    const depth = Math.sqrt(EARTH_RADIUS * EARTH_RADIUS - o * o) + 0.03;
    attr.setXYZ(i++,
      earthPivot.position.x + _rayDir.x * depth + lx,
      earthPivot.position.y + ly,
      earthPivot.position.z + _rayDir.z * depth + lz);
  } else {
    attr.setXYZ(i++,
      earthPivot.position.x + _rayDir.x * 6 + lx,
      earthPivot.position.y + ly,
      earthPivot.position.z + _rayDir.z * 6 + lz);
  }
  return i;
}

function updateRays(lines, offsets, isHit) {
  const attr = lines.geometry.attributes.position;
  let i = 0;
  for (const o of offsets) {
    if (o === 0) {
      i = writeRay(attr, i, 0, 0, isHit);
      continue;
    }
    for (const az of RAY_AZIMUTHS) {
      i = writeRay(attr, i, o, az, isHit);
    }
  }
  attr.needsUpdate = true;
}

// ---- Observer view ----
// Pins the camera to Earth (above the north pole), looking toward Polaris.
// Because the camera rides the spinning Earth, the sky appears to wheel
// around the pole -- the Big Dipper visibly circles Polaris.
const OBSERVER_FOV = 115;   // widest observer field (narrowed by zoom)
const OBSERVER_RADIUS = 1.02;   // just above the surface, so the ground and
                                // horizon are visible in the lower view

// Initial observer FOV: on narrow (mobile portrait) screens start tighter so
// the sky objects (Big Dipper) are already reasonably large.
function initialObserverFov() {
  const aspect = innerWidth / innerHeight;
  return Math.max(60, Math.min(OBSERVER_FOV, OBSERVER_FOV * Math.max(0.55, aspect / 0.8)));
}

let observerMode = false;
let obsFov = null;               // current observer FOV (null = not observing)
let savedCamOffset = null, savedTargetOffset = null, savedFov = null, savedUp = null;
const _obsCamPos = new THREE.Vector3();
const _obsUp = new THREE.Vector3();
const _antiSolar = new THREE.Vector3();
const _obsViewAxis = new THREE.Vector3();

// Stand on the spinning Earth at the chosen latitude, looking toward Polaris.
// camera.up = local vertical, so the horizon stays level while the sky wheels
// around the pole -- the Big Dipper circles Polaris, dipping under the
// horizon at lower latitudes. Runs every render (even while paused).
// The camera is anchored in the Earth's local frame (a child of the spinning
// earth mesh), so it stays at exactly one fixed location on the surface;
// its world position circles the axis with the planet's rotation.
// With "Annual view" checked, the roll reference becomes the anti-solar
// direction instead of the local vertical: the diurnal spin is cancelled,
// the Sun stays fixed, and only the annual drift remains -- the Dipper
// completes exactly one circle around Polaris per orbit (per year).
function updateObserverView() {
  const latRad = Number($('lat').value) * Math.PI / 180;
  observer.position.set(
    Math.cos(latRad) * OBSERVER_RADIUS,
    Math.sin(latRad) * OBSERVER_RADIUS,
    0
  );
  observer.updateWorldMatrix(true, true);
  observer.getWorldPosition(_obsCamPos);
  camera.position.copy(_obsCamPos);
  _obsUp.copy(_obsCamPos).sub(earthPivot.position).normalize();
  if ($('annual').checked) {
    _antiSolar.copy(earthPivot.position).negate().normalize();
    _obsViewAxis.copy(POLARIS_POS).sub(_obsCamPos).normalize();
    _obsUp.copy(_antiSolar)
      .addScaledVector(_obsViewAxis, -_antiSolar.dot(_obsViewAxis))
      .normalize();
  }
  camera.up.copy(_obsUp);
  camera.lookAt(POLARIS_POS);

  // Observer zoom: telephoto via FOV. The stars are at effectively infinite
  // distance, so dollying can't magnify them -- only a narrower field can.
  if (camera.fov !== obsFov) {
    camera.fov = obsFov;
    camera.updateProjectionMatrix();
  }
}

function setObserverMode(on) {
  if (on === observerMode) return;
  observerMode = on;
  if (on) {
    // Remember the view RELATIVE to Earth, so it can be restored correctly
    // even though the planet keeps orbiting while in observer mode.
    savedCamOffset = camera.position.clone().sub(earthPivot.position);
    savedTargetOffset = controls.target.clone().sub(earthPivot.position);
    savedFov = camera.fov;
    savedUp = camera.up.clone();
    obsFov = initialObserverFov();
    camera.fov = obsFov;
    camera.updateProjectionMatrix();
    controls.enabled = false;
  } else {
    camera.position.copy(earthPivot.position).add(savedCamOffset);
    controls.target.copy(earthPivot.position).add(savedTargetOffset);
    camera.up.copy(savedUp);
    camera.fov = savedFov;
    camera.updateProjectionMatrix();
    controls.enabled = true;
    prevEarthPos.copy(earthPivot.position);
    obsFov = null;
  }
  $('observer').classList.toggle('active', on);
  requestRender();
}
$('observer').addEventListener('click', () => setObserverMode(!observerMode));

// Wheel + pinch zoom in observer view: telephoto via FOV (narrowing the
// field magnifies the sky -- stars are at infinite distance).
let pinchDist = null;
renderer.domElement.addEventListener('wheel', (e) => {
  if (!observerMode) return;
  e.preventDefault();
  obsFov = Math.min(OBSERVER_FOV, Math.max(8, obsFov * Math.pow(1.0015, e.deltaY)));
  requestRender();
}, { passive: false });
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!observerMode || e.touches.length !== 2 || pinchDist === null) return;
  e.preventDefault();
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  obsFov = Math.min(OBSERVER_FOV, Math.max(8, obsFov * (pinchDist / d)));
  pinchDist = d;
  requestRender();
}, { passive: false });
renderer.domElement.addEventListener('touchend', () => { pinchDist = null; });

// Default framing: the Earth up close with the Sun also in frame -- the
// camera at close distance with a small lateral offset (perpendicular to the
// Earth-Sun axis), so the Sun's disc sits just beside the Earth's limb.
function frameDefault() {
  const p = earthPivot.position;
  const d = Math.hypot(p.x, p.z) || 1;
  const px = -p.z / d;
  const pz = p.x / d;
  camera.position.set(p.x + (p.x / d) * 11.5 + px * 1.6, p.y, p.z + (p.z / d) * 11.5 + pz * 1.6);
  controls.target.set(p.x, p.y, p.z);
  controls.update();
}

// ---- Today: click the date row to jump the demo state to the real date ----
// Only the date/position changes; the current view (camera, mode, framing)
// is left untouched -- the follow camera simply rides the Earth to its new
// position, preserving the relative view.
function goToToday() {
  angle = ((demoDayFromToday() - 1) / DAYS_YEAR) * 2 * Math.PI;
  earthPivot.position.set(Math.cos(angle) * ORBIT_RADIUS, 0, Math.sin(angle) * ORBIT_RADIUS);
  moonAngle = angle * MOON_ORBITS_PER_YEAR * moonFactor();
  // snap the spin so the hour of day matches the real current time
  const now = new Date();
  const realHour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  earth.rotation.y = (realHour / 24) * 2 * Math.PI;
  clouds.rotation.y = earth.rotation.y * 1.15;
  refreshDayOfYear();
  requestRender();
}
$('todayRow').addEventListener('click', goToToday);

// Reset ALL speeds to their defaults: the day length to its default and all
// ratios to 100% of real.
$('resetRatio').addEventListener('click', () => {
  $('dayLen').value = 3.4;
  $('speed').value = 100;
  $('rotSpeed').value = 100;
  $('moonSpeed').value = 100;
  requestRender();
});

// ---- Star catalog: pick a name and the camera points at it ----
// 洞明 is Alcor (辅), so it shares Alcor's position.
const STAR_CATALOG = [
  { id: 'sun',      en: 'Sun',                zh: '\u592A\u9633',   pos: () => new THREE.Vector3(0, 0, 0) },
  { id: 'moon',     en: 'Moon',               zh: '\u6708\u7403',   pos: () => { const p = new THREE.Vector3(); moon.getWorldPosition(p); return p; } },
  { id: 'polaris',  en: 'Polaris',            zh: '\u5317\u6781\u661F', pos: () => POLARIS_POS.clone() },
  { id: 'dubhe',    en: 'Dubhe (\u5929\u67A2)', zh: '\u5929\u67A2',  pos: () => bdPos[0].clone() },
  { id: 'merak',    en: 'Merak (\u5929\u7487)', zh: '\u5929\u7487',  pos: () => bdPos[1].clone() },
  { id: 'phecda',   en: 'Phecda (\u5929\u73D1)', zh: '\u5929\u73D1',  pos: () => bdPos[2].clone() },
  { id: 'megrez',   en: 'Megrez (\u5929\u6743)', zh: '\u5929\u6743',  pos: () => bdPos[3].clone() },
  { id: 'alioth',   en: 'Alioth (\u7389\u8861)', zh: '\u7389\u8861',  pos: () => bdPos[4].clone() },
  { id: 'mizar',    en: 'Mizar (\u5F00\u9633)', zh: '\u5F00\u9633',  pos: () => bdPos[5].clone() },
  { id: 'alkaid',   en: 'Alkaid (\u6447\u5149)', zh: '\u6447\u5149',  pos: () => bdPos[6].clone() },
  { id: 'alcor',    en: 'Alcor (\u6D1E\u660E)', zh: '\u8F85\u661F\uFF08\u6D1E\u660E\uFF09', pos: () => skyDir(35.7, 15.7).multiplyScalar(BD_RADIUS) },
  { id: 'yinyuan',  en: '\u9690\u5143 Yinyuan (traditional)', zh: '\u9690\u5143', pos: () => bdExtraPos[0].clone() },
];

let pointing = null;              // (reserved) camera framing state
const _pointDir = new THREE.Vector3();
const _pointPerp = new THREE.Vector3();
const _upY = new THREE.Vector3(0, 1, 0);
const _upX = new THREE.Vector3(1, 0, 0);

// Point at a star using the load-view framing: the Earth stays centered
// with the chosen star beside it, exactly like the Sun appears on load.
// The camera takes the same distance and lateral offset as the load view.
function pointCameraAt(worldPos) {
  if (observerMode) setObserverMode(false);
  _pointDir.copy(worldPos).sub(earthPivot.position).normalize();
  _pointPerp.crossVectors(_upY, _pointDir);   // sign matches the load view (object on the left)
  if (_pointPerp.lengthSq() < 1e-6) _pointPerp.crossVectors(_upX, _pointDir);
  _pointPerp.normalize();
  const e = earthPivot.position;
  camera.position.set(
    e.x - _pointDir.x * 11.5 + _pointPerp.x * 1.6,
    e.y - _pointDir.y * 11.5 + _pointPerp.y * 1.6,
    e.z - _pointDir.z * 11.5 + _pointPerp.z * 1.6
  );
  controls.target.set(e.x, e.y, e.z);
  controls.update();
  requestRender();
}

function buildStarList() {
  const sel = $('starList');
  sel.innerHTML = '';
  const none = document.createElement('option');
  none.value = '';
  none.textContent = t('lblNone');
  sel.appendChild(none);
  for (const s of STAR_CATALOG) {
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = lang === 'zh' ? s.zh : s.en;
    sel.appendChild(o);
  }
}
buildStarList();

$('starList').addEventListener('change', (e) => {
  const entry = STAR_CATALOG.find((s) => s.id === e.target.value);
  if (entry) pointCameraAt(entry.pos());
  $('starList').value = '';
});
renderer.domElement.addEventListener('pointerdown', () => { pointing = null; });

$('reset').addEventListener('click', () => {
  if (observerMode) setObserverMode(false);
  frameDefault();
  requestRender();
});
controls.addEventListener('change', requestRender);

// ---- Collapsible HUD panel ----
const hud = document.getElementById('hud');
const hudToggle = document.getElementById('hudToggle');

function setHudCollapsed(collapsed) {
  hud.classList.toggle('collapsed', collapsed);
  requestRender();
  try { localStorage.setItem('orbit.hudCollapsed', collapsed ? '1' : '0'); } catch {}
}

hudToggle.addEventListener('click', () => {
  setHudCollapsed(!hud.classList.contains('collapsed'));
});

let hudSaved = null;
try { hudSaved = localStorage.getItem('orbit.hudCollapsed'); } catch {}
if (hudSaved !== null) {
  setHudCollapsed(hudSaved === '1');
} else if (matchMedia('(max-width: 640px)').matches) {
  setHudCollapsed(true);   // mobile users start with the panel folded
}

const angleLabel = document.getElementById('angle');
const orbitRateLabel = document.getElementById('orbitRate');
const spinRateLabel = document.getElementById('spinRate');
const moonRateLabel = document.getElementById('moonRate');
const fpsLabel = document.getElementById('fps');
const dayLabel = document.getElementById('day');
const seasonLabel = document.getElementById('season');
const hourLabel = document.getElementById('hour');
const _daySunDir = new THREE.Vector3();

// Real day of year (1-365) + Northern-hemisphere season from the Sun's
// declination + hour of day from the Earth's spin (0.0 = midnight).
// Day 1 = Jan 1; the orbit angle 0 sits at the Dec 21 solstice.
function refreshDayOfYear() {
  const day = Math.floor(((angle / (2 * Math.PI)) * DAYS_YEAR + SOLSTICE_DAY - 1) % DAYS_YEAR) + 1;
  dayLabel.textContent = String(day);
  _daySunDir.copy(earthPivot.position).negate().normalize();
  const decDeg = 90 - Math.acos(
    Math.min(1, Math.max(-1, _daySunDir.dot(POLARIS_DIR)))
  ) * 180 / Math.PI;
  seasonLabel.textContent =
    decDeg > 8 ? t('lblSeason').summer : decDeg < -8 ? t('lblSeason').winter : t('lblSeason').equinox;
  hourLabel.textContent = (((earth.rotation.y / (2 * Math.PI)) % 1 + 1) % 1 * 24).toFixed(1);
}

// ---- Animation loop (power & heat friendly) ----
const worldTime = { value: 0 };
const MAX_FPS = 60;
const FRAME_MS = 1000 / MAX_FPS;
const MAX_DT_MS = 250;    // clamp frame gaps (tab switches, hiccups)

// Time accumulator: on 60Hz displays we render every RAF tick; on 120Hz+
// we render every other tick. No wall-clock boundary rounding, so cadence
// stays even and pause/resume never stalls or jumps.
let lastTick = 0;
let accumulator = 0;
let lastRenderTime = 0;
const _northPole = new THREE.Vector3();   // reused, no per-frame allocation

// Follow camera: translated by Earth's orbital motion each frame, so the
// Earth stays centered while the rest of the system sweeps past.
const prevEarthPos = new THREE.Vector3(ORBIT_RADIUS, 0, 0);
const _followDelta = new THREE.Vector3();

let fpsCount = 0;
let fpsMeasureTime = performance.now();
function measureFps() {
  fpsCount++;
  if (performance.now() - fpsMeasureTime >= 1000) {
    fpsLabel.textContent = String(fpsCount);
    fpsCount = 0;
    fpsMeasureTime += 1000;
  }
}

function updateScene(dt) {
  worldTime.value += dt;
  angle += orbitDegPerSec() * (Math.PI / 180) * dt;

  // Orbit: Earth's center travels on a circle in the ecliptic (XZ) plane
  earthPivot.position.set(
    Math.cos(angle) * ORBIT_RADIUS,
    0,
    Math.sin(angle) * ORBIT_RADIUS
  );

  if (!observerMode) {
    // Follow camera (relative view is preserved; drag still works as usual)
    _followDelta.copy(earthPivot.position).sub(prevEarthPos);
    camera.position.add(_followDelta);
    controls.target.add(_followDelta);
  }
  prevEarthPos.copy(earthPivot.position);

  // Sun light rays: the cylinder follows the Sun-Earth axis
  _rayDir.copy(earthPivot.position).normalize();
  updateRays(hitRays, RAY_HIT, true);
  updateRays(missRays, RAY_MISS, false);

  // Moon: rides the Earth, orbiting once per 27.32 days at 100% (the real
  // ratio), independently adjustable via the Moon slider.
  moonAngle += (2 * Math.PI / dayLenSec()) * (MOON_ORBITS_PER_YEAR / DAYS_YEAR) * moonFactor() * dt;
  moonGroup.position.copy(earthPivot.position);
  moonGroup.rotation.y = moonAngle;

  // Earth's own rotation (about its fixed, Polaris-pointing axis)
  const spin = spinRadPerSec();
  earth.rotation.y += spin * dt;
  clouds.rotation.y += spin * 1.15 * dt;

  // Hint line: from Earth's north pole toward Polaris (reused vectors/buffers)
  _northPole.copy(earthPivot.position).addScaledVector(POLARIS_DIR, 2.6);
  const hintPositions = hintLine.geometry.attributes.position;
  hintPositions.setXYZ(0, _northPole.x, _northPole.y, _northPole.z);
  hintPositions.setXYZ(1, POLARIS_POS.x, POLARIS_POS.y, POLARIS_POS.z);
  hintPositions.needsUpdate = true;
  const lineDist = hintLine.geometry.attributes.lineDistance;
  lineDist.setX(0, 0);
  lineDist.setX(1, _northPole.distanceTo(POLARIS_POS));
  lineDist.needsUpdate = true;

  angleLabel.innerHTML = ((angle * 180 / Math.PI) % 360).toFixed(1) + '&deg;';
  orbitRateLabel.innerHTML = orbitDegPerSec().toFixed(1) + '&deg;/s';
  const realRatio = Number($('rotSpeed').value) / 100;
  const spinRate = spinRadPerSec();
  const daySec = spinRate > 0 ? (2 * Math.PI / spinRate).toFixed(1) : '\u221E';
  spinRateLabel.textContent = t('spinRate')
    .replace('{rev}', (spinRate * 60 / (2 * Math.PI)).toFixed(0))
    .replace('{n}', (365.25 * realRatio).toFixed(1))
    .replace('{d}', daySec);
  const moonDeg = (360 / (dayLenSec() * 27.32)) * moonFactor();
  moonRateLabel.textContent = t('moonRate')
    .replace('{sp}', moonDeg.toFixed(1))
    .replace('{n}', (orbitDegPerSec() > 0 ? moonDeg / orbitDegPerSec() : 0).toFixed(1));

  refreshDayOfYear();

  // Sun subtle pulse
  const pulse = worldTime.value;
  sun.scale.setScalar(1 + 0.012 * Math.sin(pulse * 2.4));
  glow.material.opacity = 0.85 + 0.1 * Math.sin(pulse * 1.7);

  // Polaris twinkle (37.5 solar radii -> ~26250 units)
  polarisSprite.scale.setScalar(37.5 * 700 + 1930 * Math.sin(pulse * 2.1));
}

function animate(now) {
requestAnimationFrame(animate);

  // Real elapsed time since the previous tick (clamped); the baseline is
  // kept fresh while paused so resuming never injects a time jump.
  const elapsed = lastTick === 0 ? 0 : Math.min(now - lastTick, MAX_DT_MS);
  lastTick = now;

  if (paused) {
    accumulator = 0;
    // Idle: render only when something changed (camera drag, UI toggles, resize)
    if (needsRender && now - lastRenderTime >= FRAME_MS) {
      lastRenderTime = now;
      needsRender = false;
      measureFps();
      if (observerMode) updateObserverView();
      if (!observerMode) controls.update();
      renderer.render(scene, camera);
    }
    return;
  }

  // Throttle to MAX_FPS while keeping exact motion timing via the accumulator.
  accumulator += elapsed;
  if (accumulator >= FRAME_MS) {
    const dt = accumulator / 1000;
    accumulator = 0;
    measureFps();
    updateScene(dt);
    if (observerMode) updateObserverView();
    if (!observerMode) controls.update();
    renderer.render(scene, camera);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  requestRender();
});

requestAnimationFrame(animate);
refreshDayOfYear();
</script>
