<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Earth Orbit Around the Sun</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 16px; left: 16px;
    background: rgba(10, 14, 24, 0.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 14px 16px;
    color: #e8eefc;
    min-width: 240px;
    user-select: none;
  }
  #hud h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 10px; color: #ffd27a; }
  #hud label { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 7px 0; color: #b9c6e0; cursor: pointer; }
  #hud input[type="range"] { flex: 1; accent-color: #ffd27a; height: 4px; }
  #hud input[type="checkbox"] { accent-color: #ffd27a; }
  #hud button {
    margin-top: 8px; width: 100%; padding: 6px 0; font-size: 12px;
    background: rgba(255, 210, 122, 0.12); color: #ffd27a;
    border: 1px solid rgba(255, 210, 122, 0.4); border-radius: 6px;
    cursor: pointer; transition: background 0.15s;
  }
  #hud button:hover { background: rgba(255, 210, 122, 0.25); }
  #hud .stat { font-size: 11px; color: #7f8db0; margin-top: 8px; }
  #hud .stat span { color: #ffd27a; }
</style>
</head>
<body>

<div id="hud">
  <h1>EARTH &bull; SUN SYSTEM</h1>
  <label>Orbit speed
    <input type="range" id="speed" min="0" max="300" value="30" step="1" />
  </label>
  <label>Rotation speed
    <input type="range" id="rotSpeed" min="0" max="100" value="100" step="1" />
  </label>
  <label><input type="checkbox" id="pause" /> Pause</label>
  <label><input type="checkbox" id="clouds" checked /> Clouds layer</label>
  <label><input type="checkbox" id="orbitPath" checked /> Orbit path</label>
  <label><input type="checkbox" id="axis" /> Show Earth's tilt axis</label>
  <label><input type="checkbox" id="polaris" checked /> Polaris hint</label>
  <button id="reset">Reset camera</button>
  <div class="stat">Orbital angle: <span id="angle">0.0&deg;</span></div>
  <div class="stat">Orbit: <span id="orbitRate"></span> &nbsp; Rotation: <span id="spinRate"></span></div>
  <div class="stat">Render rate: <span id="fps">-</span> fps</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 9, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 80;

// ---- Sun ----
const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sunGeo = new THREE.SphereGeometry(2.2, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc55 });
const sun = new THREE.Mesh(sunGeo, sunMat);
sunGroup.add(sun);

// Glow sprite texture (generated radial gradient)
function makeGlowTexture(inner, mid, edge) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, inner);
  g.addColorStop(0.25, mid);
  g.addColorStop(0.6, 'rgba(255, 120, 40, 0.15)');
  g.addColorStop(1, edge);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(255, 214, 130, 1)', 'rgba(255, 180, 80, 0.55)', 'rgba(255, 80, 20, 0)'),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
}));
glow.scale.set(16, 16, 1);
sunGroup.add(glow);

// Faint corona ring for flair
const corona = new THREE.Mesh(
  new THREE.RingGeometry(2.4, 2.7, 64),
  new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
);
corona.rotation.x = Math.PI / 2;
sunGroup.add(corona);

// ---- Lighting ----
const sunLight = new THREE.PointLight(0xffffff, 1.6, 0, 0);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x223344, 0.5));

// ---- Stars ----
const starCount = 6000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i += 3) {
  const r = 500 + Math.random() * 900;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i]     = r * Math.sin(phi) * Math.cos(theta);
  starPos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPos[i + 2] = r * Math.cos(phi);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, sizeAttenuation: false }));
scene.add(stars);

// ---- Earth ----
const ORBIT_RADIUS = 8;
const EARTH_TILT = 23.44 * Math.PI / 180;

// Earth's spin axis is fixed in space (like the real one), pointing toward Polaris:
// tilted 23.44° from the orbit normal (+Y), leaning toward +X.
const POLARIS_DIR = new THREE.Vector3(Math.sin(EARTH_TILT), Math.cos(EARTH_TILT), 0);
const POLARIS_DIST = 110;                 // far away
const POLARIS_POS = POLARIS_DIR.clone().multiplyScalar(POLARIS_DIST);

const earthPivot = new THREE.Group();     // positioned along the orbit each frame
earthPivot.rotation.z = -EARTH_TILT;      // fixed axial tilt -> spin axis = POLARIS_DIR
scene.add(earthPivot);

const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

const earthMat = new THREE.MeshPhongMaterial({
  map: loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
  specularMap: loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'),
  specular: new THREE.Color(0x333333),
  shininess: 8,
  emissive: new THREE.Color(0x0a1420),
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(1.15, 64, 64), earthMat);
earthPivot.add(earth);

// Clouds layer (rotates slightly faster)
const cloudMat = new THREE.MeshPhongMaterial({
  map: loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
  transparent: true,
  opacity: 0.6,
  depthWrite: false,
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.17, 64, 64), cloudMat);
earthPivot.add(clouds);

// Tilt axis indicator (along the spin axis, through the planet's center)
const axisMat = new THREE.MeshBasicMaterial({ color: 0x7fd7ff, transparent: true, opacity: 0.7 });
const axisLine = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 5.8, 6), axisMat);
const axisTip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), axisMat);
axisTip.position.y = 3.0;
const axisTip2 = axisTip.clone();
axisTip2.position.y = -3.0;
const axisGroup = new THREE.Group();
axisGroup.add(axisLine, axisTip, axisTip2);
axisGroup.visible = false;
earthPivot.add(axisGroup);

// ---- Polaris ----
const polarisGroup = new THREE.Group();
scene.add(polarisGroup);

// Bright star marker
const polarisSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(224, 234, 255, 1)', 'rgba(150, 180, 255, 0.6)', 'rgba(80, 120, 255, 0)'),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
}));
polarisSprite.position.copy(POLARIS_POS);
polarisSprite.scale.set(3.4, 3.4, 1);
polarisGroup.add(polarisSprite);

// "Polaris" label
function makeLabelTexture(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 72px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(150, 190, 255, 0.9)';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#d6e6ff';
  ctx.fillText(text, 256, 64);
  return new THREE.CanvasTexture(c);
}
const polarisLabel = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeLabelTexture('POLARIS'),
  transparent: true,
  depthWrite: false,
}));
polarisLabel.position.copy(POLARIS_POS).addScaledVector(POLARIS_DIR, -3.4);
polarisLabel.scale.set(7, 1.75, 1);
polarisGroup.add(polarisLabel);

// Hint line: from Earth's north pole toward Polaris (dashed, updated each frame)
const hintGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const hintLine = new THREE.Line(hintGeo, new THREE.LineDashedMaterial({
  color: 0x9fd8ff,
  dashSize: 0.7,
  gapSize: 0.45,
  transparent: true,
  opacity: 0.5,
}));
hintLine.computeLineDistances();   // precompute dashed-line distances (done once)
scene.add(hintLine);

// Orbit path
const orbitLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(
    Array.from({ length: 128 }, (_, i) => {
      const a = (i / 128) * Math.PI * 2;
      return new THREE.Vector3(Math.cos(a) * ORBIT_RADIUS, 0, Math.sin(a) * ORBIT_RADIUS);
    })
  ),
  new THREE.LineBasicMaterial({ color: 0x3a5f9e, transparent: true, opacity: 0.45 })
);
scene.add(orbitLine);

// ---- State & UI ----
let paused = false;
let cloudsOn = true;
let angle = 0;

// Nonlinear (quadratic-ish) mappings: the low end of each slider gets
// fine-grained steps, so slow-motion Earth rotation is tunable.
// Orbit speed: slider 0-300, default 30 -> 15 deg/s (squared curve beyond).
function orbitDegPerSec() {
  return 15 * Math.pow(Number($('speed').value) / 30, 2.2);
}
// Rotation speed: slider 0-100, default 100 -> 2.2 rad/s (21 rev/min).
function spinRadPerSec() {
  return 2.2 * Math.pow(Number($('rotSpeed').value) / 100, 2);
}

const $ = (id) => document.getElementById(id);

// Render only when something actually changes (idle pause = zero GPU work).
let needsRender = true;
const requestRender = () => { needsRender = true; };

$('pause').addEventListener('change', (e) => {
  paused = e.target.checked;
  accumulator = 0;       // resume cleanly: no leftover time, no jump
  needsRender = true;
});
$('clouds').addEventListener('change', (e) => { clouds.visible = cloudsOn = e.target.checked; requestRender(); });
$('orbitPath').addEventListener('change', (e) => { orbitLine.visible = e.target.checked; requestRender(); });
$('axis').addEventListener('change', (e) => { axisGroup.visible = e.target.checked; requestRender(); });
$('polaris').addEventListener('change', (e) => {
  polarisGroup.visible = hintLine.visible = e.target.checked;
  requestRender();
});
$('speed').addEventListener('input', requestRender);
$('rotSpeed').addEventListener('input', requestRender);
$('reset').addEventListener('click', () => {
  camera.position.set(0, 9, 26);
  controls.target.set(0, 0, 0);
  controls.update();
  requestRender();
});
controls.addEventListener('change', requestRender);

const angleLabel = document.getElementById('angle');
const orbitRateLabel = document.getElementById('orbitRate');
const spinRateLabel = document.getElementById('spinRate');
const fpsLabel = document.getElementById('fps');

// ---- Animation loop (power & heat friendly) ----
const worldTime = { value: 0 };
const MAX_FPS = 60;
const FRAME_MS = 1000 / MAX_FPS;
const MAX_DT_MS = 250;    // clamp frame gaps (tab switches, hiccups)

// Time accumulator: on 60Hz displays we render every RAF tick; on 120Hz+
// we render every other tick. No wall-clock boundary rounding, so cadence
// stays even and pause/resume never stalls or jumps.
let lastTick = 0;
let accumulator = 0;
let lastRenderTime = 0;
const _northPole = new THREE.Vector3();   // reused, no per-frame allocation

let fpsCount = 0;
let fpsMeasureTime = performance.now();
function measureFps() {
  fpsCount++;
  if (performance.now() - fpsMeasureTime >= 1000) {
    fpsLabel.textContent = String(fpsCount);
    fpsCount = 0;
    fpsMeasureTime += 1000;
  }
}

function updateScene(dt) {
  worldTime.value += dt;
  angle += orbitDegPerSec() * (Math.PI / 180) * dt;

  // Orbit: Earth's center travels on a circle in the ecliptic (XZ) plane
  earthPivot.position.set(
    Math.cos(angle) * ORBIT_RADIUS,
    0,
    Math.sin(angle) * ORBIT_RADIUS
  );

  // Earth's own rotation (about its fixed, Polaris-pointing axis)
  const spin = spinRadPerSec();
  earth.rotation.y += spin * dt;
  clouds.rotation.y += spin * 1.15 * dt;

  // Hint line: from Earth's north pole toward Polaris (reused vectors/buffers)
  _northPole.copy(earthPivot.position).addScaledVector(POLARIS_DIR, 3.1);
  const hintPositions = hintLine.geometry.attributes.position;
  hintPositions.setXYZ(0, _northPole.x, _northPole.y, _northPole.z);
  hintPositions.setXYZ(1, POLARIS_POS.x, POLARIS_POS.y, POLARIS_POS.z);
  hintPositions.needsUpdate = true;
  const lineDist = hintLine.geometry.attributes.lineDistance;
  lineDist.setX(0, 0);
  lineDist.setX(1, _northPole.distanceTo(POLARIS_POS));
  lineDist.needsUpdate = true;

  angleLabel.innerHTML = ((angle * 180 / Math.PI) % 360).toFixed(1) + '&deg;';
  orbitRateLabel.innerHTML = orbitDegPerSec().toFixed(1) + '&deg;/s';
  spinRateLabel.innerHTML = (spinRadPerSec() * 60 / (2 * Math.PI)).toFixed(1) + ' rev/min';

  // Sun subtle pulse
  const t = worldTime.value;
  sun.scale.setScalar(1 + 0.012 * Math.sin(t * 2.4));
  glow.material.opacity = 0.85 + 0.1 * Math.sin(t * 1.7);

  // Polaris twinkle
  polarisSprite.scale.setScalar(3.4 + 0.25 * Math.sin(t * 2.1));
}

function animate(now) {
requestAnimationFrame(animate);

  // Real elapsed time since the previous tick (clamped); the baseline is
  // kept fresh while paused so resuming never injects a time jump.
  const elapsed = lastTick === 0 ? 0 : Math.min(now - lastTick, MAX_DT_MS);
  lastTick = now;

  if (paused) {
    accumulator = 0;
    // Idle: render only when something changed (camera drag, UI toggles, resize)
    if (needsRender && now - lastRenderTime >= FRAME_MS) {
      lastRenderTime = now;
      needsRender = false;
      measureFps();
      controls.update();
      renderer.render(scene, camera);
    }
    return;
  }

  // Throttle to MAX_FPS while keeping exact motion timing via the accumulator.
  accumulator += elapsed;
  if (accumulator >= FRAME_MS) {
    const dt = accumulator / 1000;
    accumulator = 0;
    measureFps();
    updateScene(dt);
    controls.update();
    renderer.render(scene, camera);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  requestRender();
});

requestAnimationFrame(animate);
</script>
</body>
</html>
